{% extends "base.html" %}

{% block title %}
Books
{% endblock %}

{% block content %}

<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
</head>
<body>

<h2>Delete Book</h2>

<p>Are you sure you want to delete "{{ book.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<br>

<a href="{% url 'book_list' %}">Cancel</a>

</body>
</html>


{% endblock %}
